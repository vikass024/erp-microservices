services:
  api-gateway:
    build:
      context: ./api-gateway
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      AUTH_SERVICE_URL: http://auth-service:4000
    depends_on:
      auth-service:
        condition: service_started
    networks:
      - erp-network

  auth-service:
    build:
      context: ./services/auth-service
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      DB_HOST: auth-db
      DB_PORT: 5432
      DB_USER: erp_user
      DB_PASS: change_me_for_local_development
      DB_NAME: erp_auth
      JWT_SECRET: change_me_to_a_long_random_local_development_secret
    depends_on:
      auth-db:
        condition: service_healthy
    networks:
      - erp-network

  auth-db:
    image: postgres:16
    environment:
      POSTGRES_USER: erp_user
      POSTGRES_PASSWORD: change_me_for_local_development
      POSTGRES_DB: erp_auth
    volumes:
      - auth-db-data:/var/lib/postgresql/data
      - ./services/auth-service/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp_user -d erp_auth"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - erp-network

volumes:
  auth-db-data:

networks:
  erp-network:
    driver: bridge
